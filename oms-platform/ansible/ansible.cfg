[defaults]
inventory                   = inventory/gcp.yml
roles_path                  = roles
collections_path            = .collections
host_key_checking           = False
# community.general.yaml se retiró en community.general 12; el callback
# por defecto ya formatea en YAML con result_format.
stdout_callback             = ansible.builtin.default
callback_result_format      = yaml
forks                       = 10
retry_files_enabled         = False
interpreter_python          = auto_silent

[inventory]
enable_plugins              = google.cloud.gcp_compute, yaml, ini
# Sin credenciales GCP (p. ej. en local) el inventario dinámico falla:
# seguimos con el localhost implícito, que es lo que usan los playbooks.
unparsed_is_failed          = False

[ssh_connection]
pipelining                  = True
control_path                = ~/.ssh/ansible-cp-%%h-%%p-%%r
