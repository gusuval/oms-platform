---
# ── STAGING ──────────────────────────────────────────────
# Diferencias legítimas con producción: identidad, capacidad y escalones
# del canary. Todo lo demás (comportamiento) vive en all.yml.

env:         "staging"                    # identidad del entorno
gcp_project: "gusuval-acme-oms-stg2"   # proyecto GCP distinto por entorno

# Capacidad — ajustada a tráfico de QA (mismos valores que staging.tfvars)
cloud_run_min_instances: 0                # escala a cero: sin tráfico, sin coste
cloud_run_max_instances: 2                # tope conservador para QA
cloud_run_cpu:    "1000m"                 # la carga de QA no necesita más
cloud_run_memory: "1Gi"

# Escalones de tráfico: staging va directo al 100% (nadie real sufre un fallo)
traffic_steps: [100]

# Notificaciones
slack_channel: "#deploys-staging"
