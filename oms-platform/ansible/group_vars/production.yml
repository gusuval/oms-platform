---
# ── PRODUCTION ───────────────────────────────────────────
# La ÚNICA diferencia legítima respecto a staging.yml es esta lista.
# `diff group_vars/staging.yml group_vars/production.yml` debe ser corto
# y cada línea explicable en un PR.

env:         "production"                 # identidad del entorno
gcp_project: "gusuval-acme-oms-prod"      # proyecto GCP distinto por entorno

# Capacidad — tráfico real con headroom (mismos valores que production.tfvars)
cloud_run_min_instances: 5                # nunca a cero: evita cold starts
cloud_run_max_instances: 25               # NFR-SCAL-001: pico 5×
cloud_run_cpu:    "2000m"                 # latencia p95 con carga real
cloud_run_memory: "2Gi"

# Escalones de tráfico: canary progresivo (mismo algoritmo, más pasos)
traffic_steps: [10, 50, 100]

# Notificaciones
slack_channel: "#deploys-production"
