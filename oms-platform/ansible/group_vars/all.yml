---
# Variables comunes a todos los entornos.
# Si una variable cambia entre staging y producción, va en su group_vars/<env>.yml.
# Si no cambia, va aquí.

project_prefix: "oms"
region:         "europe-west3"

# Registry ÚNICO para todos los entornos: la imagen se construye una vez
# (en staging) y producción despliega exactamente el mismo digest.
artifact_registry_project: "gusuval-acme-oms-staging"
image_repo: "europe-west3-docker.pkg.dev/{{ artifact_registry_project }}/oms/oms"

# El SHA de la imagen se pasa por -e en el comando, NO se hardcodea.
# Esto garantiza que el mismo SHA viaja a través de la promoción.
# image_sha: ← se pasa con -e image_sha=sha256:...

# Healthcheck endpoint
health_path: "/healthz"
container_port: 8080

# Cloud Run service name pattern (= nombre que crea Terraform)
cloud_run_service: "{{ project_prefix }}-{{ env }}"

# Dominio público. Vacío = <IP-del-LB>.nip.io (igual que en Terraform).
public_hostname: ""

# Comportamiento del rollout — IDÉNTICO en todos los entornos.
rollout_pause_seconds: 60          # observación entre pasos del canary
healthcheck_retries:   10
healthcheck_delay:     6
