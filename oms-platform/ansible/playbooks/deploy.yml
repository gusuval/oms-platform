---
# ── playbook: deploy.yml ──────────────────────────────────────────
# Despliega un image_sha concreto al entorno indicado.
#
# Uso:
#   ansible-playbook playbooks/deploy.yml \
#     -e env=staging \
#     -e image_sha=sha256:a1b2c3d4...
#
# Idempotencia: ejecutar dos veces seguidas con el mismo image_sha
# devuelve changed=0 la segunda vez.

- name: "Deploy OMS — {{ env | default('?') }}"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - "../group_vars/all.yml"
    - "../group_vars/{{ env }}.yml"

  pre_tasks:
    - name: "Validar parámetros obligatorios"
      ansible.builtin.assert:
        that:
          - env is defined
          - env in ['staging', 'production']
          - image_sha is defined
          - image_sha is match('^sha256:[a-f0-9]{64}$')
        fail_msg: |
          Faltan parámetros o image_sha no es un digest válido.
          Uso: ansible-playbook playbooks/deploy.yml \
                 -e env=<staging|production> \
                 -e image_sha=sha256:<64 hex chars>
        quiet: true

    - name: "Mostrar resumen del despliegue"
      ansible.builtin.debug:
        msg: |
          ╔═══════════════════════════════════════════════════════════╗
          ║  Entorno:        {{ env }}
          ║  Proyecto GCP:   {{ gcp_project }}
          ║  Servicio:       {{ cloud_run_service }}
          ║  Imagen:         {{ image_repo }}@{{ image_sha }}
          ║  Min/Max inst:   {{ cloud_run_min_instances }}/{{ cloud_run_max_instances }}
          ║  Escalones:      {{ traffic_steps | join('% → ') }}%
          ╚═══════════════════════════════════════════════════════════╝

  roles:
    - role: oms_cloud_run
      vars:
        full_image: "{{ image_repo }}@{{ image_sha }}"

  post_tasks:
    - name: "Verificar healthcheck del servicio desplegado"
      ansible.builtin.uri:
        url: "{{ public_url }}{{ health_path }}"
        status_code: 200
        validate_certs: "{{ healthcheck_validate_certs | default(true) }}"
        timeout: 5
      register: final_health
      until: final_health.status == 200
      retries: "{{ healthcheck_retries }}"
      delay: "{{ healthcheck_delay }}"
      check_mode: false
      changed_when: false

    - name: "Notificar a Slack"
      # Solo si el rollout cambió algo y hay webhook (variable de entorno,
      # nunca en el repo). Una segunda ejecución sin cambios no notifica.
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'SLACK_WEBHOOK_URL') }}"
        method: POST
        body_format: json
        body:
          channel: "{{ slack_channel }}"
          text: ":rocket: OMS {{ env }} → `{{ image_sha }}` (revisión {{ target_revision }})"
        status_code: 200
      changed_when: false
      when:
        - rollout_changed | default(false)
        - lookup('ansible.builtin.env', 'SLACK_WEBHOOK_URL') | length > 0
