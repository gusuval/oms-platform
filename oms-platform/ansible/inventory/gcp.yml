---
# Inventario dinámico de GCP.
#
# El playbook de despliegue de Cloud Run no necesita SSH a hosts — usa la API
# directamente desde el control node (localhost implícito). Este inventario
# sirve para el BONUS bastion: cualquier VM con label role=bastion aparece en
# el grupo role_bastion.
#
# Uso:
#   GCP_PROJECT=gusuval-acme-oms-stg2 ansible-inventory -i inventory/gcp.yml --graph

plugin: google.cloud.gcp_compute
projects:
  - "{{ lookup('env', 'GCP_PROJECT') | default('gusuval-acme-oms-stg2', true) }}"
zones:
  - europe-west3-a
  - europe-west3-b
  - europe-west3-c
auth_kind: application
filters:
  - "status = RUNNING"

keyed_groups:
  - key: labels.env
    prefix: env
  - key: labels.role
    prefix: role

# Usar IP privada (no exponer)
hostnames:
  - networkInterfaces[0].networkIP

compose:
  ansible_host: networkInterfaces[0].networkIP
